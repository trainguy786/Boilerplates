---
- name: Update all servers
  hosts: all
  become: yes
  gather_facts: yes

  tasks:

    - name: Update APT-based servers (Debian/Ubuntu)
      when: ansible_os_family == "Debian"
      apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes

    - name: Update YUM/DNF-based servers (RHEL/CentOS/Rocky/Alma)
      when: ansible_os_family == "RedHat"
      yum:
        name: "*"
        state: latest

    - name: Reboot if required (Debian/Ubuntu)
      when:
        - ansible_os_family == "Debian"
        - ansible_facts.packages['needrestart'] is defined
      command: needrestart -r a
      ignore_errors: yes

    - name: Reboot if required on RHEL-based systems
      when:
        - ansible_os_family == "RedHat"
      reboot:
        msg: "Rebooting after updates if needed"
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: whoami
